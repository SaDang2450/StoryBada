<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<section layout:fragment="contents" class="container d-flex justify-content-center">
    <th:block th:replace="~{fragments/left-side-zone :: article}"></th:block>

    <div class="main-zone d-flex justify-content-center">
        <div class="hall-detail-box mt-5 border-1 d-flex justify-content-center align-items-center">
            <div>
                <div class="d-flex mb-3">
                    <div class="mr-5" th:text="${hallDTO.name}">등록 닉네임</div>
                    <div th:text="${hallDTO.userLoginId}">등록 유저 ID</div>
                </div>
                <div class="d-flex">
                    <div class="hall-comment form-control mr-3 p-3 input-shadow" th:text="${hallDTO.contents}">전당 등록 멘트</div>
                    <div class="hall-detail-image-area">
                        <img class="img-100" th:if="${hallDTO.imagePath} != null" th:src="${hallDTO.imagePath}">
                        <img class="img-100" th:if="${hallDTO.imagePath} == null" th:src="@{/images/no_photo.jpg}">
                    </div>
                </div>
            </div>

        </div>
    </div>

</section>

<script layout:fragment="script">


</script>
