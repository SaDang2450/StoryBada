<!DOCTYPE html>
<html lang="ko" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"

<section layout:fragment="contents" class="container d-flex justify-content-center">

<script layout:fragment="script">
    $("button[name=bettingBtn]").on("click", function () {
        let betting = $(this).data("betting");
        let hp = $("#bettingHp").val();

        // validation
        if (hp === "") {
            alert("베팅 금액 입력");
            return;
        }

        $.ajax({
            type: "POST",
            url: "/game/dice/bet",
            data: {
                "betting": betting,
                "hp": hp
            },
            success: function (response) {
                if (response.code === 1000) {
                    alert("배팅 성공");
                } else if (response.code === 4001) {
                    alert("error : dice betting fail\n" + response.message);
                } else if (response.code === 4002) {
                    alert("error : dice betting fail\n" + response.message);
                } else {
                    alert("error : dice betting fail");
                }

                location.reload();
            },
            error: function () {
                alert("error : dice betting error");
            }

        })
    })

    function updateRemainTime() {
        let now = new Date();
        let seconds = now.getSeconds();

        let remainTime = 59 - seconds;

        $("#remainTimeSpan").text(remainTime);

        if(remainTime === 59) {
            $.ajax({
                type: "POST",
                url:"/game/dice/reload",
                success: function(response) {
                    if(response.data) {
                        $("#diceBettingTotal").load(location.href + " #diceBettingTotal");
                        $("#currentPoint").load(location.href + " #currentPoint");
                    }
                },
                error: function() {
                    alert("error: reload error");
                }
            })
        }
    }

    setInterval(updateRemainTime, 1000);

    updateRemainTime();

</script>
</html>
