<!DOCTYPE html>
<html lang="ko" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<section layout:fragment="contents" class="container d-flex justify-content-center">
    <th:block th:replace="~{fragments/left-side-zone :: article}"></th:block>

    <div class="main-zone d-flex justify-content-center">
        <div class="game-zone">
            <div class="box-history border-1 d-flex flex-column align-items-center">
                <div class="h1">랜덤 박스 개봉 기록</div>
                <table class="table table-borderless table-box-history text-center">
                    <thead>
                    <tr>
                        <th>No.</th>
                        <th>결과</th>
                        <th>시간</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr style="height:10px;"></tr>
                    <tr th:each="myBoxHistoryDTO : ${myBoxHistoryDTOList}">
                        <td th:text="${myBoxHistoryDTO.count}">12</td>
                        <td th:text="${myBoxHistoryDTO.result}">0</td>
                        <td th:text="${#temporals.format(myBoxHistoryDTO.createdAt, 'YYYY-MM-dd HH:mm')}">YYYY-MM-DD
                            HH:mm:SS
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div class="pagination">
                    <a th:if="${boxPageDTO.hasPrevGroup}" th:href="@{/game/box/history(page=${boxPageDTO.prevGroupPage})}">[이전]</a>
                    <span th:each="i : ${#numbers.sequence(boxPageDTO.startPage, boxPageDTO.endPage)}">
                        <a th:href = "@{/game/box/history(page=${i})}" th:text = "${i}" th:classappend="${(i - 1) == myBoxHistoryPage.number} ? 'current' : ''"></a>
                    </span>
                    <a th:if="${boxPageDTO.hasNextGroup}" th:href="@{/game/box/history(page=${boxPageDTO.nextGroupPage})}">[다음]</a>
                </div>
            </div>
        </div>

        <div class="game-result-zone">
            <div class="hall border-1">
                <div class="font-larger">전당기록</div>
                <div class="mt-3">
                    <div id="boxHall">
                        <div th:fragment="tableBoxHallFragment" class="d-flex justify-content-center">
                            <table class="table table-sm table-borderless font-small table-box-hall text-center ">
                                <thead>
                                <tr>
                                    <th>순위</th>
                                    <th>닉네임</th>
                                    <th>획득 점수</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="boxHallDTO : ${boxHallDTOList}">
                                    <td class="column1" th:text="${boxHallDTO.ranking}">1</td>
                                    <td class="column2" th:text="${boxHallDTO.name}" >닉네임1</td>
                                    <td class="column3" th:text="${boxHallDTO.hp}">점수1</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="recent border-1">
                <div class="font-larger">최근결과</div>
                <div class="mt-3">
                    <div id="boxRecent">
                        <div th:fragment="tableBoxRecentFragment" class="d-flex justify-content-start">
                            <table class="table table-sm table-borderless font-small table-box-recent text-center">
                                <thead>
                                <tr>
                                    <th>게임 회차</th>
                                    <th>개봉 갯수</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="boxRecentDTO : ${boxRecentDTOList}">
                                    <td class="column1"><span th:text="${boxRecentDTO.gameId}">1</span></td>
                                    <td class="column2"><span th:text="${boxRecentDTO.count}">10</span></td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script layout:fragment="script">

</script>
</html>
