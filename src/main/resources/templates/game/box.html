<!DOCTYPE html>
<html lang="ko" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<section layout:fragment="contents" class="container d-flex justify-content-center">
    <th:block th:replace="~{fragments/left-side-zone :: article}"></th:block>

    <div class="main-zone d-flex justify-content-center">
        <div class="game-zone">
            <div class="box border-1 d-flex flex-column align-items-center justify-content-between">
                <div class="h1">랜덤 박스 구매</div>
                <table class="table table-borderless table-box-buying">
                    <tbody>
                    <tr class="box-image-row">
                        <td>
                            <div class="temp-image"></div>
                        </td>
                        <td>
                            <div class="temp-image"></div>
                        </td>
                        <td>
                            <div class="temp-image"></div>
                        </td>
                    </tr>
                    <tr class="box-btn-row">
                        <td>
                            <button name="buyingBoxBtn" data-amount=1 type="button"
                                    class="btn btn-primary form-control btn-box-buying btn-shadow">1개 구매
                            </button>
                        </td>
                        <td>
                            <button name="buyingBoxBtn" data-amount=5 type="button"
                                    class="btn btn-primary form-control btn-box-buying btn-shadow">5개 구매
                            </button>
                        </td>
                        <td>
                            <button name="buyingBoxBtn" data-amount=10 type="button"
                                    class="btn btn-primary form-control btn-box-buying btn-shadow">10개
                                구매
                            </button>
                        </td>
                    </tr>
                    <tr class="box-image-row">
                        <td>
                            <div class="temp-image"></div>
                        </td>
                        <td>
                            <div class="temp-image"></div>
                        </td>
                        <td>
                            <div class="temp-image"></div>
                        </td>
                    </tr>
                    <tr class="box-btn-row">
                        <td>
                            <button name="buyingBoxBtn" data-amount=50 type="button"
                                    class="btn btn-primary form-control btn-box-buying btn-shadow">50개
                                구매
                            </button>
                        </td>
                        <td>
                            <button name="buyingBoxBtn" data-amount=100 type="button"
                                    class="btn btn-primary form-control btn-box-buying btn-shadow">100개
                                구매
                            </button>
                        </td>
                        <td>
                            <button name="buyingBoxBtn" data-amount=500 type="button"
                                    class="btn btn-primary form-control btn-box-buying btn-shadow">500개
                                구매
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <table class="table table-borderless table-box-info text-center font-larger mb-0">
                    <tbody>
                    <tr>
                        <td style="width:70%">개봉까지 남은시간</td>
                        <td style="width:30%"><span id="remainTimeSpan">SS</span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="box-betting border-1 d-flex flex-column align-items-center justify-content-between">
                <table class="table table-borderless table-box-betting font-larger text-center">
                    <tbody>
                    <tr>
                        <td class="column1">랜덤 박스 보유 개수</td>
                        <td class="column2"><span id="holdingBoxAmountSpan" th:text="${holdingBoxAmount}">120</span></td>
                        <td class="column3">개</td>
                    </tr>
                    <tr>
                        <td class="column1">평균 획득 포인트</td>
                        <td class="column2"><span id="averageBoxGetPointSpan" th:text="${averageBoxGetPoint}">50</span></td>
                        <td class="column3">HP</td>
                    </tr>
                    </tbody>
                </table>
                <div>
                    <button id="boxHistoryBtn" type="button" class="btn btn-primary form-control btn-shadow">기록보기
                    </button>
                </div>
            </div>
        </div>

        <div class="game-result-zone">
            <div class="hall border-1">
                <div class="font-larger">전당기록</div>
                <div class="mt-3">
                    <div id="boxHall">
                        <div th:fragment="tableBoxHallFragment" class="d-flex justify-content-center">
                            <table class="table table-sm table-borderless font-small table-box-hall text-center ">
                                <thead>
                                    <tr>
                                        <th>순위</th>
                                        <th>닉네임</th>
                                        <th>획득 점수</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="boxHallDTO : ${boxHallDTOList}">
                                        <td class="column1" th:text="${boxHallDTO.ranking}">1</td>
                                        <td class="column2" th:text="${boxHallDTO.name}" >닉네임1</td>
                                        <td class="column3" th:text="${boxHallDTO.hp}">점수1</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="recent border-1">
                <div class="font-larger">최근결과</div>
                <div class="mt-3">
                    <div id="boxRecent">
                        <div th:fragment="tableBoxRecentFragment" class="d-flex justify-content-start">
                            <table class="table table-sm table-borderless font-small table-box-recent text-center">
                                <thead>
                                <tr>
                                    <th>게임 회차</th>
                                    <th>개봉 갯수</th>
                                </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="boxRecentDTO : ${boxRecentDTOList}">
                                        <td class="column1"><span th:text="${boxRecentDTO.gameId}">1</span></td>
                                        <td class="column2"><span th:text="${boxRecentDTO.count}">10</span></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script layout:fragment="script">
    $("#boxHistoryBtn").on("click", function () {
        location.href = "/game/box/history?page=1";
    })

    $("button[name=buyingBoxBtn]").on("click", function () {
        let amount = $(this).data("amount");

        $.ajax({
            type: "POST",
            url: "/game/box/buying",
            data: {
                "amount": amount
            },
            success: function (response) {
                if (response.code === 1000) {
                    alert("buying box succeed : " + amount);
                } else if (response.code === 4001) {
                    alert("error : box buying fail\n" + response.message);
                } else {
                    alert("error : dice betting fail");
                }

                location.reload();
            },
            error: function () {
                alert("error : box buying error");
            }
        })
    })

    function updateRemainTime() {
        let now = new Date();
        let seconds = now.getSeconds();

        let remainTime = 80 - seconds;
        if (remainTime >= 60) {
            remainTime -= 60;
        }

        $("#remainTimeSpan").text(remainTime);

        if (remainTime === 59) {
            $("#boxRecent").load("/game/box/reload/recent");
            $("#boxHall").load("/game/box/reload/hall");

            $.ajax({
                type: "POST",
                url: "/game/box/reload",
                success: function (response) {
                    $("#holdingBoxAmountSpan").text(response.holdingBoxAmount);
                    $("#averageBoxGetPointSpan").text(response.averageBoxGetPoint);
                    $("#currentPoint").text(response.userDTO.point);
                },
                error: function () {
                    alert("error: reload error");
                }
            })
        }
    }

    setInterval(updateRemainTime, 1000);

    updateRemainTime();

</script>
</html>
