<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<section layout:fragment="contents" class="container d-flex justify-content-center">
    <div class="login-box mt-5 border-1">
        <div class="login-box-header d-flex align-items-center p-3">
            <i class="bi bi-file-earmark-person h3 m-0"></i><span class="h3 m-0">회원가입 정보 입력</span>
        </div>
        <div class="login-box-contents py-5 d-flex justify-content-center">
            <div class="w-100">
                <table class="table table-borderless table-login">
                    <tbody>
                    <tr>
                        <td class="column1 pb-0 text-right align-middle">아이디</td>
                        <td class="column2 pb-0"><input id="loginIdInput" type="text" class="form-control input-shadow"
                                                        autocomplete="off"></td>
                        <td class="column3 pb-0">
                            <button id="loginIdDuplicationCheckBtn" type="button" class="btn btn-secondary btn-shadow">
                                중복확인
                            </button>
                        </td>
                    </tr>
                    <tr class="comment-row">
                        <td class="column1"></td>
                        <td class="column2 py-0"><span
                                class="align-top text-black-50">영어 소문자, 숫자만 입력 가능. 최소 4자 이상 입력하세요.</span>
                        </td>
                        <td class="column3"></td>
                    </tr>
                    <tr>
                        <td class="column1 text-right align-middle">비밀번호</td>
                        <td class="column2"><input id="passwordInput" type="password" class="form-control input-shadow">
                        </td>
                        <td class="column3"></td>
                    </tr>
                    <tr>
                        <td class="column1"></td>
                        <td class="column2"></td>
                        <td class="column3"></td>
                    </tr>
                    <tr>
                        <td class="column1 pb-0 text-right align-middle">비밀번호 확인</td>
                        <td class="column2 pb-0"><input id="passwordConfirmInput" type="password"
                                                        class="form-control input-shadow"></td>
                        <td class="column3 pb-0"></td>
                    </tr>
                    <tr class="comment-row">
                        <td class="column1"></td>
                        <td class="column2 py-0"><span id="passwordInvalidSpan" class="align-top text-danger d-none">비밀번호 불일치</span></td>
                        <td class="column3"></td>
                    </tr>
                    <tr>
                        <td class="column1 pb-0 text-right align-middle">대표 닉네임</td>
                        <td class="column2 pb-0"><input id="nameInput" type="text" class="form-control input-shadow"
                                                        autocomplete="off"></td>
                        <td class="column3 pb-0"></td>
                    </tr>
                    <tr class="comment-row">
                        <td class="column1"></td>
                        <td class="column2 py-0"><span
                                class="align-top text-black-50">닉네임은 수정이 불가능하지만 언제든지 추가 가능합니다.</span></td>
                        <td class="column3"></td>
                    </tr>
                    <tr>
                        <td class="column1 pb-0 text-right align-middle">E-mail</td>
                        <td class="column2 pb-0"><input id="emailInput" type="text" class="form-control input-shadow"
                                                        autocomplete="off"></td>
                        <td class="column3 pb-0">
                            <button id="emailRequestBtn" type="button" class="btn btn-primary btn-shadow">인증번호 받기
                            </button>
                        </td>
                    </tr>
                    <tr class="comment-row">
                        <td class="column1"></td>
                        <td class="column2 py-0"><span id="emailNaverOnly" class="d-none"><span
                                class="align-top text-danger">네이버 메일주소(@naver.com)</span>만 허용합니다.<br></span>
                        </td>
                        <td class="column3"></td>
                    </tr>
                    <tr>
                        <td class="column1 text-right align-middle">인증번호</td>
                        <td class="column2"><input id="signInput" type="text" class="form-control input-shadow"
                                                   autocomplete="off"></td>
                        <td class="column3">
                            <button id="signBtn" type="button" class="btn btn-primary btn-shadow">인증번호 확인
                            </button>
                        </td>
                    </tr>
                    <tr>
                        <td class="column1"></td>
                        <td class="column2"></td>
                        <td class="column3"></td>
                    </tr>
                    </tbody>
                </table>

                <div class="d-flex justify-content-center">
                    <button id="registerBtn" type="button" class="btn btn-danger btn-shadow mx-3">회원가입</button>
                    <button id="cancelBtn" type="button" class="btn btn-secondary btn-shadow mx-3">취소</button>
                </div>
            </div>
        </div>
    </div>

</section>

<script layout:fragment="script">
    let loginIdDuplicationCheck = false;
    let emailDuplicationCheck = false;
    let signCheck = false;
    let loginIdPass = false;
    let emailPass = false;
    let signPass = false;

    $("#loginIdDuplicationCheckBtn").on("click", function () {
        let loginId = $("#loginIdInput").val();

        // validation
        if (loginId === "") {
            alert("아이디 입력");
            return;
        }

        $.ajax({
            type: "POST",
            url: "/user/duplicate-id",
            data: {
                "loginId": loginId
            },
            success: function (response) {
                loginIdDuplicationCheck = true;

                if (response.data) {
                    alert("아이디 사용 가능");
                    loginIdPass = true;
                } else {
                    alert("아이디 중복. 사용 불가능");
                    loginIdPass = false;
                }
            },
            error: function () {
                alert("error : duplication check error");
            }
        })
    })

    $("#loginIdInput").on("input", function () {
        loginIdDuplicationCheck = false;
    })

    $("#emailRequestBtn").on("click", function () {
        let email = $("#emailInput").val();

        const regEmail = /^[0-9a-zA-Z]([-_\.]?[0-9a-zA-Z])*@(naver.com)$/;

        // validation
        if (email === "") {
            alert("이메일 입력");
            return;
        }
        //
        // if (!regEmail.test(email)) {
        //     alert("네이버 메일만 가능");
        //     return;
        // }

        $.ajax({
            type: "POST",
            url: "/user/duplicate-email",
            data: {
                "email": email
            },
            success: function (response) {
                emailDuplicationCheck = true;

                if (response.data) {
                    alert("인증 메일 발송");
                    emailPass = true
                    $.ajax({
                        type: "POST",
                        url: "/email/send",
                        data: {
                            "email": email
                        },
                        success: function (response) {
                            if (response.data) {
                                alert("인증번호 메일 발송됨");
                            } else {
                                alert("error : email send fail");
                            }
                        },
                        error : function() {
                            alert("error : email send error");
                        }
                    })
                } else {
                    alert("이메일 중복. 사용 불가");
                    emailPass = false;
                }
            },
            error: function () {
                alert("error : email request error");
            }
        })
    })

    $("#emailInput").on("input", function () {
        emailDuplicationCheck = false;
        let email = $("#emailInput").val();

        const regEmail = /^[0-9a-zA-Z]([-_\.]?[0-9a-zA-Z])*@(naver.com)$/;

        if (regEmail.test(email)) {
            $("#emailNaverOnly").addClass("d-none");
        } else {
            $("#emailNaverOnly").removeClass("d-none")
        }

    })

    $("#signBtn").on("click", function () {
        let email = $("#emailInput").val();
        let authNum = $("#signInput").val();

        const regEmail = /^[0-9a-zA-Z]([-_\.]?[0-9a-zA-Z])*@(naver.com)$/;
        const regAuthNum = /^[0-9]*$/

        // validation
        if (email === "") {
            alert("이메일 입력");
            return;
        }
        //
        // if (!regEmail.test(email)) {
        //     alert("네이버 메일만 가능");
        //     return;
        // }

        if (authNum === "") {
            alert("인증번호 입력");
            return;
        }

        if (!regAuthNum.test(authNum)) {
            alert("인증번호 숫자 입력");
            return;
        }
        //

        $.ajax({
            type: "POST",
            url: "/email/confirm",
            data: {
                "authNum": authNum
            },
            success: function (response) {
                signCheck = true;

                if(response.data) {
                    alert("인증 확인");
                    signPass = true;
                } else {
                    alert("인증 실패");
                    signPass = false;
                }
            },
            error: function () {
                alert("error : email confirm error");
            }

        })
    })

    $("#signInput").on("input", function () {
        signCheck = false;
    })

    $("#passwordConfirmInput").on("input", function() {
        let password = $("#passwordInput").val();
        let passwordConfirm = $("#passwordConfirmInput").val();

        if(password !== passwordConfirm) {
            $("#passwordInvalidSpan").removeClass("d-none");
        } else {
            $("#passwordInvalidSpan").addClass("d-none");
        }
    })

    $("#passwordInput").on("input", function() {
        let password = $("#passwordInput").val();
        let passwordConfirm = $("#passwordConfirmInput").val();

        if(password !== passwordConfirm) {
            $("#passwordInvalidSpan").removeClass("d-none");
        } else {
            $("#passwordInvalidSpan").addClass("d-none");
        }
    })

    $("#registerBtn").on("click", function () {
        let loginId = $("#loginIdInput").val();
        let password = $("#passwordInput").val();
        let passwordConfirm = $("#passwordConfirmInput").val();
        let name = $("#nameInput").val();
        let email = $("#emailInput").val();
        let sign = $("#signInput").val();

        const regEmail = /^[0-9a-zA-Z]([-_\.]?[0-9a-zA-Z])*@(naver.com)$/;

        // validation
        if (loginId === "") {
            alert("아이디 입력");
            return;
        }

        if (password === "") {
            alert("비밀번호 입력");
            return;
        }

        if (password !== passwordConfirm) {
            alert("비밀번호 확인");
            return;
        }

        if (name === "") {
            alert("대표 닉네임 입력");
            return;
        }

        if (email === "") {
            alert("이메일 입력");
            return;
        }
        //
        // if (!regEmail.test(email)) {
        //     alert("네이버 메일만 가능");
        //     return;
        // }

        if (sign === "") {
            alert("인증번호 입력");
            return;
        }

        if (!loginIdDuplicationCheck) {
            alert("아이디 중복 확인 체크 필요");
            return;
        }

        if (!emailDuplicationCheck) {
            alert("이메일 인증 필요");
            return;
        }

        if (!signCheck) {
            alert("이메일 인증번호 확인 필요");
            return;
        }

        if(loginIdPass && emailPass && signPass) {
            $.ajax({
                type: "POST",
                url: "/user/create",
                data: {
                    "loginId": loginId,
                    "password": password,
                    "name": name,
                    "email": email
                },
                success: function(response) {
                    if(response.data) {
                        alert("회원가입 성공. 로그인 해주세요");
                        location.href = "/frontpage";
                    } else {
                        alert("error : register fail");
                    }
                },
                error: function() {
                    alert("error : register error");
                }
            })
        }
    })

</script>
